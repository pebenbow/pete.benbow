		<circle cx="150" cy="220" r="20" />
	</g>
	<g fill="#0b0c0e" stroke="#5aa9ff" stroke-width="9">
		<circle cx="280" cy="220" r="26" />
		<circle cx="450" cy="160" r="26" />
		<circle cx="620" cy="260" r="26" />
