<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
	<defs>
		<filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="60" />
		</filter>
		<pattern id="dots2" width="28" height="28" patternUnits="userSpaceOnUse">
			<circle cx="2" cy="2" r="1.4" fill="#26292e" />
		</pattern>
	</defs>

	<rect width="800" height="450" fill="#0b0c0e" />
	<rect width="800" height="450" fill="url(#dots2)" />

	<circle cx="620" cy="110" r="150" fill="#8b5cf6" opacity="0.2" filter="url(#blur2)" />
	<circle cx="160" cy="360" r="140" fill="#2780e3" opacity="0.18" filter="url(#blur2)" />

	<g fill="none" stroke="#a78bfa" stroke-width="8" stroke-linecap="round">
		<path d="M150 300 L280 220" />
		<path d="M150 220 L280 220" />
		<path d="M280 220 L450 160" />
		<path d="M450 160 L620 260" />
