<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 675">
	<defs>
		<filter id="blur3" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="70" />
		</filter>
		<pattern id="dots3" width="28" height="28" patternUnits="userSpaceOnUse">
			<circle cx="2" cy="2" r="1.4" fill="#26292e" />
		</pattern>
	</defs>

	<rect width="800" height="675" fill="#0b0c0e" />
	<rect width="800" height="675" fill="url(#dots3)" />

	<circle cx="210" cy="170" r="170" fill="#ff7a45" opacity="0.18" filter="url(#blur3)" />
	<circle cx="610" cy="500" r="180" fill="#8b5cf6" opacity="0.2" filter="url(#blur3)" />

	<!-- Stand and beam -->
	<g fill="none" stroke="#ff9770" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
		<path d="M400 160 V585" />
		<path d="M300 590 H500" />
		<path d="M190 205 H610" />
		<path d="M190 205 L115 415" />
		<path d="M190 205 L265 415" />
		<path d="M610 205 L535 415" />
		<path d="M610 205 L685 415" />
